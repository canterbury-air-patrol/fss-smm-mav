name: Docker Build and Push

on:
  push:
    branches:
      - develop
      - 'release/[0-9]*'
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

jobs:
  # Publication used to be independent of verification. Both workflows triggered
  # on a push to develop, but GitHub Actions imposes no ordering or success
  # dependency between separate workflows, so a commit that compiled but failed
  # its tests could publish `latest` --- sometimes before the failure was even
  # visible. Release branches and tags were worse: Build and Test never ran for
  # those refs at all, so the refs that become actual releases were the ones
  # with no verification behind them.
  #
  # `needs: verify` on the same checked-out SHA closes both. This runs the full
  # gate set (unit tests, distcheck, ASan/UBSan/TSan, static analysis) for
  # release branches and tags too, which is what docs/decisions.md's note about
  # develop-only triggers deliberately left open: that decision is about not
  # adding redundant *branch* triggers to Build and Test, not about publishing
  # unverified artifacts.
  verify:
    uses: ./.github/workflows/verify.yml

  docker:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The image build compiles the tree (COPY . /src), which needs the
          # mavlink submodule headers.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="canterburyairpatrol/cap-fmu"
          ref="${GITHUB_REF}"
          if [[ "$ref" == "refs/heads/develop" ]]; then
            sha="${GITHUB_SHA::7}"
            echo "tags=${IMAGE}:latest,${IMAGE}:${sha}" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/heads/release/* ]]; then
            ver="${ref#refs/heads/release/}"
            echo "tags=${IMAGE}:${ver}" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/tags/v* ]]; then
            ver="${ref#refs/tags/v}"
            echo "tags=${IMAGE}:${ver}" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/tags/* ]]; then
            ver="${ref#refs/tags/}"
            echo "tags=${IMAGE}:${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: No tags computed
        if: ${{ steps.tags.outputs.tags == '' }}
        run: |
          echo "::error::No tags were computed for ref ${GITHUB_REF}; refusing to build."
          exit 1

      # Build into the local daemon first and smoke-test the *artifact* rather
      # than a host build of the same source. The push below reuses this build
      # from cache, so this costs a load, not a second compile.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: cap-fmu:ci-smoke
          # The SHA the image was built from, baked into
          # /etc/cap-fmu-manifest. The build context has no .git, so the image
          # cannot work this out for itself --- unpassed it records "unknown",
          # which is honest but useless on a published tag.
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          # The entrypoint refuses to start without a valid TERMINATE_ACTION, so
          # drive the binary directly for the CLI checks. /usr/bin/cap-fmu is
          # the installed path --- the image used to run the binary out of its
          # own build tree at /src/src/cap-fmu, which is what obliged it to ship
          # that tree.
          docker run --rm --entrypoint /usr/bin/cap-fmu cap-fmu:ci-smoke --version
          docker run --rm --entrypoint /usr/bin/cap-fmu cap-fmu:ci-smoke --help

          # The entrypoint must fail loudly on a missing TERMINATE_ACTION rather
          # than launching with an unset flight-termination action.
          if docker run --rm cap-fmu:ci-smoke; then
            echo "::error::entrypoint started with no TERMINATE_ACTION set"
            exit 1
          fi

          # Config generation must work as the unprivileged runtime user against
          # the image's real config path --- the failure mode that a host-side
          # run of generate-config.sh cannot reproduce.
          docker run --rm \
            -e TERMINATE_ACTION=none \
            -e MAVPROXY_HOST=127.0.0.1 -e MAVPROXY_PORT=5760 \
            -e NAME=ci-smoke \
            -e SERVER1_ADDR=fss.example.org -e SERVER1_PORT=20202 \
            --entrypoint /home/autopilot/scripts/generate-config.sh \
            cap-fmu:ci-smoke
          # The default log directory must be writable by the runtime user, or
          # logging silently disables itself.
          docker run --rm --entrypoint sh cap-fmu:ci-smoke \
            -c 'test -w /var/log/cap-fmu'

      # What separates the runtime stage from the builder is not visible in a
      # working image: one that had quietly collapsed back into a single stage
      # would pass every check above. These are the difference itself.
      - name: The runtime stage carries no build tree or toolchain
        run: |
          status=0
          # /src is the builder's source tree, /build the runtime stage's own
          # scratch copy of docker/ --- both are removed by the time the image
          # ships, and either one present means a stage boundary was lost.
          for path in /src /build; do
            if docker run --rm --entrypoint sh cap-fmu:ci-smoke \
                 -c "test -e ${path}"; then
              echo "::error::${path} is present in the runtime image"
              status=1
            fi
          done
          # A compiler on a network-facing airborne node, and the apt lists that
          # nothing at runtime reads.
          for tool in cc gcc make ld curl gpg valgrind; do
            if docker run --rm --entrypoint sh cap-fmu:ci-smoke \
                 -c "command -v ${tool}" >/dev/null 2>&1; then
              echo "::error::${tool} is present in the runtime image"
              status=1
            fi
          done
          if docker run --rm --entrypoint sh cap-fmu:ci-smoke \
               -c 'test -n "$(ls -A /var/lib/apt/lists)"'; then
            echo "::error::apt package lists were left in the runtime image"
            status=1
          fi
          exit "$status"

      # The image records its own dependency set (docker/manifest.sh). Extract
      # it here so the versions that went into a published tag are recoverable
      # from the CI run as well as from the image --- and check it is actually
      # populated, since an empty or unrecorded manifest fails silently in
      # exactly the situation it exists for.
      - name: Extract the dependency manifest
        run: |
          docker run --rm --entrypoint cat cap-fmu:ci-smoke \
            /etc/cap-fmu-manifest > cap-fmu-manifest.txt
          cat cap-fmu-manifest.txt
          # The *runtime* library names. libsmm-asset-dev is the builder's
          # package; the flight image has libsmmasset0, the shared library the
          # binary loads (docker/dep-constraints.sh --runtime).
          for pkg in libfss-client-ssl libfss-transport libsmmasset0; do
            if ! grep -q "^${pkg}\s" cap-fmu-manifest.txt; then
              echo "::error::manifest does not record ${pkg}"
              exit 1
            fi
          done
          # An "unknown" revision here means the build-arg above stopped being
          # passed, which would publish an image that cannot be traced to a
          # commit.
          if grep -q '^source-revision: unknown$' cap-fmu-manifest.txt; then
            echo "::error::manifest has no source revision"
            exit 1
          fi
          # docker/manifest.sh runs in the runtime stage. Left in the builder it
          # would describe a package set the shipped image does not have, while
          # looking exactly as authoritative --- and a build-only package listed
          # here is the tell that it has drifted back.
          if grep -Eq '^(build-essential|[^[:space:]]*-dev)[[:space:]]' \
               cap-fmu-manifest.txt; then
            echo "::error::manifest lists build-only packages; it was captured in the builder stage"
            grep -E '^(build-essential|[^[:space:]]*-dev)[[:space:]]' cap-fmu-manifest.txt
            exit 1
          fi

      - name: Upload the dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: cap-fmu-manifest
          path: cap-fmu-manifest.txt

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Must match the build above exactly, or the cache misses and the
          # pushed image carries a different manifest from the one CI just
          # checked and uploaded.
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
