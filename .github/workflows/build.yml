name: Build and Test

# develop remains the only trigger here; see docs/decisions.md. master
# fast-forwards from a green develop, so re-running these gates on it proves
# nothing new. Release branches and tags are covered where it matters --- at
# publication --- by docker-build.yml calling the same reusable workflow,
# not by adding redundant triggers to this one.
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
