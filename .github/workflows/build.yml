name: Build and Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
    - name: Install git
      run: |
        apt-get update
        apt-get install -y git

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add CAP apt repository
      run: |
        apt-get update
        apt-get install -y lsb-release ca-certificates curl gnupg
        echo "deb http://apt.canterburyairpatrol.org/apt/$(lsb_release -sc)/ $(lsb_release -sc) main" \
          > /etc/apt/sources.list.d/cap.list
        curl -fsSL https://apt.canterburyairpatrol.org/repository.key \
          | gpg --dearmor -o /etc/apt/trusted.gpg.d/cap.gpg
        apt-get update

    - name: Install dependencies
      run: |
        apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          catch2 \
          libfss-client-ssl \
          libsmm-asset-dev

    - name: Build and test
      run: |
        autoreconf -fi
        ./configure
        make check
